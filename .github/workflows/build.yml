name: Build mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: round-timer-jar
          path: build/libs/*.jar
